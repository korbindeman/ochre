[package]
name = "browser-core"
version = "0.1.0"
description = "Core engine: tabs, spaces, adblock, vault, CDP surface (§17 architecture spec)"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "browser_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "browser"
path = "src/bin/browser.rs"

[[bin]]
name = "browser_helper"
path = "src/bin/browser_helper.rs"

# Dev-only: builds `browser` + `browser_helper` and assembles `Browser.app`
# (CEF must run from a bundle). See `src/bin/bundle.rs` and `just run`.
[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

[features]
# The CEF macOS sandbox needs a signed bundle plus `Sandbox::initialize` wiring
# in each process; that's a later (signing/entitlements) milestone. The spike
# runs unsandboxed (`Settings::no_sandbox`), which is the standard CEF dev
# configuration. Enable with `--features sandbox` once that wiring lands.
default = []
sandbox = ["cef/sandbox"]
# Pulls the RSA/rand deps the ignored live-server harness needs to register a
# fresh Vaultwarden account (see `tests/vault_live.rs`). Off by default so normal
# `cargo test` / `just verify` never compiles them.
live-tests = ["dep:rsa", "dep:rand"]

[package.metadata.cef.bundle]
helper_name = "browser_helper"
resources_path = "resources"

[dependencies]
cef = { workspace = true }
# Used only by the `bundle` binary to construct the app's `BundleInfo`.
semver = "1"
# History + favicon store (see `src/history.rs`).
rusqlite = { workspace = true }
# Derive `Serialize` on the suggestion type surfaced across the FFI boundary.
serde = { workspace = true }
# Session persistence — the tab/space/folder tree as JSON (see `src/session.rs`).
serde_json = { workspace = true }
# Password vault crypto (Bitwarden key hierarchy + EncString; ADR-0016, spec §10).
pbkdf2 = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
# Vault auth/sync HTTP client + OAuth form encoding (ADR-0016, spec §10).
ureq = { workspace = true }
form_urlencoded = { workspace = true }
# Registrable-domain matching for `vault_lookup` (ADR-0016, spec §10).
psl = { workspace = true }
# Credential-import CSV parsing (ADR-0016, spec §10).
csv = { workspace = true }
# Native request-path ad-blocking on the CEF resource path (ADR-0019, spec §11).
adblock = { workspace = true }
# Live-test-only (feature `live-tests`): RSA keypair for Vaultwarden registration.
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }

[build-dependencies]
anyhow = { workspace = true }
