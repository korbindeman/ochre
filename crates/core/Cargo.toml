[package]
name = "browser-core"
version = "0.1.0"
description = "Core: WebKit engine wrapper, tabs, spaces, adblock, vault (ADR-0072)"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "browser_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Pulls the RSA/rand deps the ignored live-server harness needs to register a
# fresh Vaultwarden account (see `tests/vault_live.rs`). Off by default so normal
# `cargo test` / `just verify` never compiles them.
live-tests = ["dep:rsa", "dep:rand"]

[dependencies]
# Release version comparison for auto-update (ADR-0052).
semver = "1"
# History + favicon store (see `src/history.rs`).
rusqlite = { workspace = true }
# Derive `Serialize` on the suggestion type surfaced across the FFI boundary.
serde = { workspace = true }
# Session persistence - the tab/space/folder tree as JSON (see `src/session.rs`).
serde_json = { workspace = true }
# Password vault crypto (Bitwarden key hierarchy + EncString; ADR-0016, spec §10).
pbkdf2 = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
# Vault auth/sync HTTP client + OAuth form encoding (ADR-0016, spec §10).
ureq = { workspace = true }
form_urlencoded = { workspace = true }
# Auto-update (ADR-0052): minisign verify + tar.gz extract of the app bundle.
flate2 = { workspace = true }
tar = { workspace = true }
minisign-verify = { workspace = true }
libc = { workspace = true }
# Registrable-domain matching for `vault_lookup` (ADR-0016, spec §10).
psl = { workspace = true }
# Credential-import CSV parsing (ADR-0016, spec §10).
csv = { workspace = true }
# Ad-blocking lists, compiled to WebKit content rules (ADR-0072).
adblock = { workspace = true }
# URL parsing for the favicon SSRF guard (scheme/host extraction; see `client/favicon.rs`).
url = { workspace = true }
# Favicon raster decode (ICO/PNG/JPEG/WebP/GIF → PNG) and SVG rasterization.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "ico",
] }
resvg = "0.44"
usvg = "0.44"
# Live-test-only (feature `live-tests`): RSA keypair for Vaultwarden registration.
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSText",
    "NSTextField",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
] }
objc2-web-kit = { workspace = true }
block2 = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }

[dev-dependencies]
proptest.workspace = true
