[package]
name = "browser-ffi"
version = "0.1.0"
description = "UniFFI + C ABI exports - the bridge between Rust core and native UIs (§17 architecture spec)"
edition.workspace = true
license.workspace = true

[lib]
name = "browser_ffi"
# cdylib: linked by the SwiftUI app. rlib: usable by other Rust crates/tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
browser-core = { path = "../core" }
# Serialize JSON payloads (structure snapshot, omnibox rows, ...).
serde_json = { workspace = true }
# Wipe the master-password copy read across the FFI boundary (see `cstr_secret`).
zeroize = { workspace = true }
