# Alpha release - build the macOS .app with proprietary codecs, Developer ID
# sign and notarize it, and publish a public pre-release with signed update
# artifacts. See docs/adr/0040 (codec build), 0042 (codec split), 0052
# (updater), 0063 (friends get signed builds) and 0070 (release path).
#
# Repo secrets (one-time setup, see docs/release.md):
#   CEF_ARTIFACT_TOKEN           read Contents on the private korbindeman/ochre_cef
#   DEVELOPER_ID_P12_BASE64      Developer ID Application cert + key, base64 .p12
#   DEVELOPER_ID_P12_PASSWORD    its export password
#   NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY   App Store Connect API key (.p8 contents)
#   UPDATE_SIGNING_PRIVATE_KEY (+ _PASSWORD)        minisign key matching update.rs
#   PROVISIONING_PROFILE_BASE64  optional; only once Apple grants the passkey entitlement
# Every one except the profile is required: the run fails instead of publishing
# a build a friend cannot open or update.
name: Alpha release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0-alpha.1"
        required: true
        type: string
  push:
    tags: ["v*-alpha*"]

permissions:
  contents: write # to create the release on this repo

jobs:
  build:
    # macos-26 = arm64 + Xcode 26 (the macOS 26 SDK this app needs: Liquid Glass,
    # LSMinimumSystemVersion 26.0). Do NOT use macos-latest - it still points at
    # macOS 15 / Xcode 16 and cannot build against the 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Marketing version = tag without leading v (semver / prerelease ok).
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          rustc --version
          brew install xcodegen just minisign

      - name: Check release secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing DEVELOPER_ID_P12_BASE64"
          [ -n "$NOTARY_KEY" ] || missing="$missing NOTARY_KEY"
          [ -n "$UPDATE_KEY" ] || missing="$missing UPDATE_SIGNING_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing. See docs/release.md."
            exit 1
          fi

      # A throwaway keychain holding only the Developer ID identity; deleted at
      # the end of the job.
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kc_pass="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          echo "RELEASE_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" \
            || { echo "::error::The .p12 holds no Developer ID Application identity."; exit 1; }
          if [ -n "$PROFILE" ]; then
            printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/release.provisionprofile"
            echo "BROWSER_PROVISIONING_PROFILE=$RUNNER_TEMP/release.provisionprofile" >> "$GITHUB_ENV"
          fi

      # Pin CFBundleShortVersionString to the release tag so the updater can
      # compare running vs remote (ADR-0052).
      - name: Set marketing version from tag
        run: |
          ver="${{ steps.meta.outputs.version }}"
          # project.yml is the source of truth for XcodeGen.
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${ver}\"/" apps/macos/project.yml
          # Keep Cargo package version in the same ballpark for diagnostics
          # (prerelease tags are valid cargo versions).
          sed -i '' "s/^version = \".*\"/version = \"${ver}\"/" crates/core/Cargo.toml
          grep MARKETING_VERSION apps/macos/project.yml
          grep '^version' crates/core/Cargo.toml

      # Pulls the codec-enabled CEF from the private ochre_cef release matching the
      # cef-dll-sys pin in Cargo.lock. Hard-fail if unavailable: a silently
      # codec-less "alpha" would defeat the point of the release.
      - name: Fetch codec-enabled CEF
        env:
          GH_TOKEN: ${{ secrets.CEF_ARTIFACT_TOKEN }}
        run: |
          cef="$(scripts/fetch-cef.sh)"
          if [ -z "$cef" ]; then
            echo "::error::Codec-enabled CEF not available. Check the CEF_ARTIFACT_TOKEN secret (needs read Contents on korbindeman/ochre_cef) and that a release matching the Cargo.lock pin exists."
            exit 1
          fi
          echo "CEF_PATH=$cef" >> "$GITHUB_ENV"
          echo "Using $cef"

      - name: Resolve product name
        id: product
        run: echo "name=$(python3 scripts/product.py name)" >> "$GITHUB_OUTPUT"

      # CEF_PATH is already exported above, so with-work-gate.sh won't re-resolve it.
      - name: Build and sign app (Release)
        run: |
          just build-release
          app="apps/macos/build/Build/Products/Release/${{ steps.product.outputs.name }}.app"
          codesign -dv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::The app is not Developer ID signed."; exit 1; }

      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_REQUIRED: "1"
        run: scripts/notarize-macos-app.sh "apps/macos/build/Build/Products/Release/${{ steps.product.outputs.name }}.app"

      - name: Verify the build actually has proprietary codecs
        run: |
          name="${{ steps.product.outputs.name }}"
          fw="apps/macos/build/Build/Products/Release/${name}.app/Contents/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework"
          if grep -q -a "h264_annex_b_to_avc_bitstream_converter" "$fw"; then
            echo "H.264 code present in the shipped framework"
          else
            echo "::error::Shipped framework has no H.264 code - this is a codec-less build."
            exit 1
          fi

      # ditto (not zip) so the .app's frameworks, symlinks, signature and
      # stapled ticket survive archiving intact. Also produce the updater archive
      # (<App>.app.tar.gz + latest.json, minisign-signed) - ADR-0052.
      - name: Package
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTES: "Alpha build. Expect rough edges."
        run: |
          name="${{ steps.product.outputs.name }}"
          app="apps/macos/build/Build/Products/Release/${name}.app"
          ditto -c -k --keepParent \
            "$app" \
            "${name}-${{ steps.meta.outputs.tag }}-macos-arm64.zip"
          chmod +x scripts/package-update-artifacts.sh
          scripts/package-update-artifacts.sh \
            "${{ steps.meta.outputs.tag }}" \
            "$app" \
            "$RUNNER_TEMP/update-artifacts"
          cp "$RUNNER_TEMP/update-artifacts/${name}.app.tar.gz" .
          cp "$RUNNER_TEMP/update-artifacts/latest.json" .
          # An unsigned manifest would make every installed copy refuse the update.
          python3 -c 'import json,sys; d=json.load(open("latest.json")); s=d["platforms"]["darwin-aarch64"]["signature"]; sys.exit(0 if s else 1)' \
            || { echo "::error::latest.json has no update signature."; exit 1; }
          # The signature must verify against the key compiled into update.rs.
          pub="$(grep -o 'PUBLIC_KEY_B64: &str = "[^"]*"' crates/core/src/update.rs | cut -d'"' -f2 | base64 --decode)"
          printf '%s\n' "$pub" > "$RUNNER_TEMP/update.pub"
          python3 -c 'import json,base64,sys; d=json.load(open("latest.json")); sys.stdout.buffer.write(base64.b64decode(d["platforms"]["darwin-aarch64"]["signature"]))' > "$RUNNER_TEMP/update.minisig"
          minisign -V -p "$RUNNER_TEMP/update.pub" -m "${name}.app.tar.gz" -x "$RUNNER_TEMP/update.minisig" \
            || { echo "::error::Update signature does not match the public key in update.rs."; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.product.outputs.name }}"
          tag="${{ steps.meta.outputs.tag }}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          **Alpha build. Expect rough edges.**

          ### Requirements
          - An **Apple Silicon** Mac (M1 or later; Intel Macs are not supported)
          - **macOS 26 (Tahoe)** or newer

          ### Install
          1. Double-click the downloaded `.zip` file to unpack it. You get `__PRODUCT__.app`.
          2. Drag `__PRODUCT__.app` into your **Applications** folder.
          3. Open it. It is signed and notarized by Apple, so it opens like any other app.

          To bring your Arc tabs and Spaces over: Settings > General > Switching from Arc.

          After that the app updates itself: when a new version is out, a card in
          the sidebar offers **Update & Restart**.

          ### Notes
          Includes proprietary codecs (H.264/AAC), so mainstream MP4 video plays.
          EOF
          sed -i '' "s/__PRODUCT__/${name}/g" "$RUNNER_TEMP/release-notes.md"

          gh release create "$tag" \
            "${name}-${tag}-macos-arm64.zip" \
            "${name}.app.tar.gz" \
            latest.json \
            --prerelease \
            --title "${name} ${tag} (alpha)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove release keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
