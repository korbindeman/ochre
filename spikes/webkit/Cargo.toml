# Throwaway WKWebView spike for ADR-0071 / backlog P0-5. Its own workspace so the
# main build (`just verify`) never compiles it. Delete once the go/no-go is made.
[package]
name = "webkit-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
adblock = { version = "0.12.5", default-features = false, features = ["full-regex-handling", "content-blocking", "embedded-domain-resolver"] }
serde_json = "1"
block2 = "0.6"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
