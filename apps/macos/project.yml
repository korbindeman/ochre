name: Browser
options:
  bundleIdPrefix: com.nativechrome
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: "YES"
    PRODUCT_NAME: Ochre
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  Browser:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes:
              - http
              - https
        # Privacy usage strings. TCC attributes a helper's camera/mic/Bluetooth/location
        # request to this app, and aborts the requesting process when the key is missing
        # (the Aug 2026 audio-helper SIGABRT). Guarded by `just privacy-check`.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        NSCameraUsageDescription: Websites you allow can use your camera.
        NSBluetoothAlwaysUsageDescription: Websites you allow can connect to Bluetooth devices.
        NSLocationUsageDescription: Websites you allow can use your location.
        NSLocationWhenInUseUsageDescription: Websites you allow can use your location.
    settings:
      base:
        PRODUCT_NAME: Ochre

        INFOPLIST_KEY_LSMinimumSystemVersion: "26.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Link against the Rust C-ABI dylib (built by the pre-build script).
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Browser-Bridging-Header.h
        OTHER_LDFLAGS: -lbrowser_ffi
        # Resolve @rpath/libbrowser_ffi.dylib + the CEF framework from the bundle.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        # Do not point this at Browser.entitlements while the identity is
        # ad-hoc: keychain-access-groups is restricted and AMFI SIGKILLs
        # (CRASH-0004 / ADR-0062). Developer ID dogfood applies
        # Browser.signed.entitlements / Browser.production.entitlements in
        # scripts/codesign-macos-app.sh after xcodebuild (ADR-0061).
        # Dev: post-build injects CEF and ad-hoc-signs the dylib + helpers
        # only. Hardened runtime is off because Chromium's V8 JIT needs it
        # disabled until production entitlements land with real signing;
        # Xcode itself skips signing (CODE_SIGNING_ALLOWED: NO).
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nativechrome.Ochre.dev
          LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/debug
          INFOPLIST_KEY_CFBundleDisplayName: Ochre Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.nativechrome.Ochre
          LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/release
          INFOPLIST_KEY_CFBundleDisplayName: Ochre
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    preBuildScripts:
      - path: ../../scripts/prebuild-macos.sh
        name: "Build Rust core & CEF bundle"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - path: ../../scripts/bundle-macos-app.sh
        name: "Inject CEF framework & ad-hoc sign"
        basedOnDependencyAnalysis: false
