[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ffi",
]

# crates/agent and apps/windows are future workspace members (§18 of the
# architecture spec). They're omitted now so the workspace compiles cleanly
# during the Step 0 spike; add them when their first code lands.

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = ""
authors = ["Native-Chrome Browser Team"]

[workspace.dependencies]
# Shared dep versions go here so crates reference them with `dep.workspace = true`.
# macOS Objective-C interop
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false }
# The web engine: WKWebView (ADR-0072). Default features = the full WebKit API.
objc2-web-kit = "0.3.2"
block2 = "0.6"

# History/favicon store. `bundled` compiles SQLite from source (the C toolchain
# is already present), so there is no system-libsqlite dependency.
rusqlite = { version = "0.40", features = ["bundled"] }
# Serialization for the FFI suggestion payload.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
libc = "0.2"
# URL parsing for the favicon SSRF guard - robust scheme/host extraction (incl.
# IPv6, userinfo, ports) instead of hand-rolled splitting on a security boundary.
# Already compiled in via `adblock`, so this adds no new crate to the build.
url = "2"
# Property tests for core invariants (ADR-0065).
proptest = "1"

# Password vault crypto (ADR-0016 / spec §10) - the Bitwarden key hierarchy and
# EncString. Standard RustCrypto crates; all load-bearing for the scheme.
pbkdf2 = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
# Chromium cookie key derivation (PBKDF2-HMAC-SHA1) for the Arc cookie import.
sha1 = "0.10"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
# Vault auth/sync HTTP (ADR-0016 / spec §10). Blocking, rustls TLS - no async
# runtime; vault calls run off the UI thread. `form_urlencoded` encodes the
# OAuth token form (the base64 password hash needs correct `+`/`/`/`=` escaping).
ureq = "3"
form_urlencoded = "1"
# Auto-update archive extract (Tauri-compatible .app.tar.gz) + minisign verify
# (ADR-0052, Zinnia model).
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
# Public Suffix List (compiled in, no runtime fetch) for correct registrable-domain
# matching in `vault_lookup` - so creds match across subdomains but never leak
# across a public suffix like `co.uk` (ADR-0016 / spec §10).
psl = "2"
# Correct RFC 4180 CSV parsing for credential import - a hand-rolled `split(',')`
# would corrupt passwords containing commas/quotes/newlines (ADR-0016 / spec §10).
csv = "1"
# Ad-blocking (Brave's adblock-rust). Its lists compile to WebKit content rules
# (`content-blocking`, ADR-0072); the engine itself serves cosmetic CSS. `embedded-domain-resolver` off: we register a `psl`-backed
# resolver (reusing the crate already compiled for the vault) instead of pulling
# in adblock's separate `addr` public-suffix crate. `single-thread` off: the engine
# is shared across the main thread and a background list-refresh thread behind
# `RwLock<Arc<Engine>>`, which requires `Engine: Send + Sync` (asserted by the crate
# only when `single-thread` is disabled).
adblock = { version = "0.12.5", default-features = false, features = ["full-regex-handling", "content-blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
